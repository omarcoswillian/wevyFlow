<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube Fé &amp; Razão — Viva sua fé de verdade</title>
<meta name="description" content="O movimento cristão que te ajuda a conhecer, viver e defender sua fé — ao lado de quem caminha com propósito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0F032D;
  --purple:#4E2BCC;
  --lavender:#905BF4;
  --paper:#F1EFF6;
  --white:#FFFFFF;
  --ink:#140628;
  --muted:#6B6080;
  --muted-d:rgba(239,239,239,.62);
  --line:rgba(20,6,40,.12);
  --line-d:rgba(255,255,255,.14);

  --sans:"Inter Tight",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --maxw:1080px;
  /* imagem do hero embutida (base64). Para trocar, substitua o data URI abaixo por url(SUA-URL) */
  --green:#15C26B;
  --green-d:#0Fa258;
  --hero-img:url('https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/hero01.jpg');
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--midnight);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--purple);color:#fff}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
section{padding:clamp(96px,15vh,180px) 0}
.panel{background:var(--paper);border-radius:clamp(26px,4vw,46px);
  margin:0 14px;overflow:hidden;position:relative;z-index:1}

/* type */
h1,h2,h3{font-family:var(--sans);font-weight:600;letter-spacing:-.035em;line-height:1.04;color:var(--ink)}
.hero h1,.hero h2,.hero h3,.pillars h2,.pillars h3,.strip h2,.strip h3,.final h2,.final h3,.tother h2,.tother h3{color:inherit}
.it{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"\2602\FE0F";margin-right:8px;font-size:.95em;vertical-align:baseline}
.mark{color:var(--purple)}
.ul-p{color:var(--paper);background-image:linear-gradient(var(--lavender),var(--lavender));background-repeat:no-repeat;background-size:100% .16em;background-position:0 100%;padding-bottom:.05em}
.lede{font-size:clamp(18px,2vw,21px);line-height:1.55;color:var(--muted)}


/* links / buttons — text-forward, minimal */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto;max-width:100%;
  white-space:nowrap;font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:-.01em;
  color:var(--white);background:var(--midnight);
  padding:18px 30px;border-radius:6px;transition:background .3s,transform .3s,box-shadow .3s,filter .3s}
.cta span{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.cta .arr{flex:0 0 auto;transition:transform .3s}
.cta:hover{background:var(--purple);transform:translateY(-1px)}
.cta:focus-visible{outline:2px solid var(--lavender);outline-offset:4px}
.cta:hover .arr{transform:translate(4px,-4px)}
.cta.brand,.cta.brand:hover{
  color:#fff;border-radius:100px;border:1px solid rgba(255,255,255,.16);
  padding:20px 34px;font-size:17px;
  background:linear-gradient(135deg,#1ED675,var(--green-d));
}
.cta.brand{box-shadow:0 14px 40px -12px rgba(21,194,107,.5)}
.cta.brand:hover{transform:translateY(-2px);filter:brightness(1.07);
  box-shadow:0 20px 52px -12px rgba(21,194,107,.65)}

.txtlink{display:inline-flex;align-items:center;gap:10px;font-weight:600;
  border-bottom:1px solid var(--line);padding-bottom:3px;transition:.3s}
.txtlink:hover{color:var(--purple);border-color:var(--purple)}

/* ============ HERO ============ */
.hero{background-color:var(--midnight);color:var(--paper);padding:0;min-height:100svh;
  display:flex;flex-direction:column;
  background-image:
    linear-gradient(90deg, rgba(15,3,45,.92) 0%, rgba(15,3,45,.55) 30%, rgba(15,3,45,.08) 54%, rgba(15,3,45,0) 72%),
    var(--hero-img);
  background-repeat:no-repeat,no-repeat;
  background-position:center,center right;
  background-size:cover,cover}
.hero-body{flex:1;display:flex;align-items:center}
.hero-body .wrap{width:100%}
.hero h1{font-size:clamp(46px,7.4vw,86px);font-weight:600;margin:0;line-height:.92}
.hero h1 .l2{font-weight:400;color:rgba(239,239,239,.55)}
.hero h1 .l2 .it{color:var(--paper);font-weight:400}
.hero p.lede{color:var(--muted-d);max-width:30ch;margin:16px 0 40px}
.hero-actions{display:flex;align-items:center;gap:36px;flex-wrap:wrap}

.hero-foot{max-width:var(--maxw);margin:0 auto;width:100%;padding:0 32px 40px;
  display:flex;align-items:center;gap:14px;color:var(--muted-d);font-size:13px}
.hero-foot .ln{flex:1;height:1px;background:var(--line-d)}

/* ============ MANIFESTO ============ */
.manifesto{text-align:center}
.manifesto h2{font-size:clamp(34px,5.5vw,68px);max-width:16ch;margin:30px auto 0;color:var(--ink)}
.manifesto h2 .it{color:var(--purple)}
.manifesto .lede{max-width:48ch;margin:34px auto 0}

/* ============ PROBLEM ============ */
.problem .lead-line{font-family:var(--sans);font-weight:600;font-size:clamp(22px,3vw,34px);
  letter-spacing:-.025em;color:var(--ink);max-width:22ch;margin-bottom:56px}
.lead-line .it{color:var(--purple)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:38px}
.tcell{border-top:2px solid var(--ink);padding-top:26px}
.tcell .n{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--lavender);display:block;margin-bottom:16px}
.tcell h3{font-size:clamp(21px,2.3vw,25px);font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.tcell p{font-size:15px;color:var(--muted);line-height:1.6}
.tother{margin-top:66px;background:var(--midnight);color:var(--paper);border-radius:24px;
  padding:clamp(36px,5vw,64px);display:grid;grid-template-columns:auto 1fr;gap:clamp(28px,5vw,56px);align-items:center}
.tother .k{font-family:var(--serif);font-style:italic;font-size:clamp(28px,4vw,46px);color:var(--lavender);line-height:1.05;white-space:nowrap}
.tother p{font-size:clamp(17px,1.8vw,21px);line-height:1.55;color:rgba(239,239,239,.9);max-width:50ch}

/* ============ PILLARS ============ */
.pillars{background:var(--midnight);color:var(--paper)}
.pillars .eyebrow{color:var(--lavender)}
.pillars h2{font-size:clamp(32px,4.8vw,58px);max-width:16ch;margin:24px 0 0}
.pillars h2 .it{color:var(--lavender)}
.plist{margin-top:80px;border-top:1px solid var(--line-d)}
.prow{display:grid;grid-template-columns:120px 1fr 2fr;gap:40px;align-items:start;
  padding:44px 0;border-bottom:1px solid var(--line-d)}
.prow .ix{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--lavender);padding-top:.35em}
.prow h3{font-size:clamp(24px,3vw,34px);font-weight:500;letter-spacing:-.03em}
.prow p{font-size:16px;color:var(--muted-d);line-height:1.65;max-width:50ch}

/* ============ MODULES ============ */
.modules .head{text-align:center;max-width:50ch;margin:0 auto}
.modules h2{font-size:clamp(30px,4.6vw,54px);margin:22px 0 0}
.modules h2 .it{color:var(--purple)}
.modules .head .lede{margin:26px auto 0;max-width:44ch}
.mlist{margin-top:84px;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:1.4fr 2fr auto;gap:40px;align-items:start;
  padding:34px 0;border-bottom:1px solid var(--line);transition:.3s}
.mrow:hover{padding-left:14px}
.mrow .mt .tag{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--lavender)}
.mrow .mt h3{font-size:clamp(20px,2.4vw,27px);font-weight:600;margin-top:8px;letter-spacing:-.025em}
.mrow .md{font-size:15px;color:var(--muted);line-height:1.6;padding-top:26px}
.mrow .me{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);white-space:nowrap;text-align:right;padding-top:26px}

/* ============ COMMUNITY ============ */
.community{display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:center}
.community .eyebrow{color:var(--purple)}
.community h2{font-size:clamp(32px,4.6vw,56px);max-width:14ch;margin:22px 0 0}
.community h2 .it{color:var(--purple)}
.community p{font-size:17px;color:var(--muted);line-height:1.65;margin-top:28px;max-width:42ch}
.brand-art{width:100%;max-width:460px;aspect-ratio:1;object-fit:cover;border-radius:24px;margin-left:auto;display:block;box-shadow:0 30px 80px -34px rgba(15,3,45,.55)}
.umb-e{font-style:normal;line-height:1;display:inline-block}

/* ============ OFFER ============ */
.offer{text-align:center}
.offer .head{max-width:46ch;margin:0 auto}
.offer h2{font-size:clamp(34px,5.2vw,62px);margin:22px 0 0}
.offer h2 .it{color:var(--purple)}
.pcard{max-width:520px;margin:74px auto 0;background:var(--white);border:1px solid var(--line);
  border-radius:16px;text-align:left;overflow:hidden}
.pcard .ph{padding:32px 36px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between}
.pcard .ph .pl{font-weight:600;font-size:15px;letter-spacing:.02em}
.pcard .ph .pl span{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.pcard .ph .badge{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--purple);border:1px solid var(--line);padding:6px 12px;border-radius:100px}
.pcard .pb{padding:36px}
.price{display:flex;align-items:flex-end;gap:7px;margin-bottom:6px}
.price .x{font-size:18px;font-weight:500;color:var(--muted);margin-bottom:8px}
.price .v{font-size:64px;font-weight:600;letter-spacing:-.05em;line-height:.85}
.price .c{font-size:22px;font-weight:600;margin-bottom:8px}
.price-note{font-size:13px;color:var(--muted);margin-bottom:32px}
.incl{list-style:none;display:grid;gap:14px;margin-bottom:34px}
.incl li{display:flex;align-items:flex-start;gap:13px;font-size:15px;color:var(--ink);line-height:1.45}
.incl li .umb-e{flex:0 0 auto;font-size:15px;margin-top:1px}
.incl .grp{font-weight:600;font-size:14px;color:var(--ink);padding-top:4px}
.incl .sep{grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lavender);padding-top:6px}
.pcard .cta{display:flex;width:fit-content;margin:4px auto 0}
.pcard .foot{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}

/* ============ GUARANTEE ============ */
.guarantee{border-top:1px solid var(--line)}
.gline{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;max-width:860px;margin:0 auto}
.gline .seven{font-family:var(--sans);font-weight:600;font-size:clamp(80px,12vw,150px);letter-spacing:-.06em;line-height:.8;color:var(--purple)}
.gline .seven small{display:block;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:600}
.gline h2{font-size:clamp(24px,3.2vw,36px);margin-bottom:16px}
.gline p{font-size:16px;color:var(--muted);line-height:1.65;max-width:52ch}

/* ============ FAQ ============ */
.faq .head{text-align:center;margin-bottom:60px}
.faq h2{font-size:clamp(30px,4.4vw,52px);margin-top:14px}
.flist{max-width:740px;margin:0 auto;border-top:1px solid var(--line)}
.fitem{border-bottom:1px solid var(--line)}
.fq{width:100%;background:none;border:none;cursor:pointer;text-align:left;color:var(--ink);
  font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:-.02em;
  padding:28px 44px 28px 0;position:relative;transition:color .25s}
.fq:hover{color:var(--purple)}
.fq:focus-visible{outline:2px solid var(--lavender);outline-offset:4px}
.fq .pm{position:absolute;right:4px;top:50%;width:16px;height:16px;transform:translateY(-50%)}
.fq .pm::before,.fq .pm::after{content:"";position:absolute;background:var(--purple);top:50%;left:50%}
.fq .pm::before{width:14px;height:1.5px;transform:translate(-50%,-50%)}
.fq .pm::after{width:1.5px;height:14px;transform:translate(-50%,-50%);transition:transform .3s}
.fitem.open .pm::after{transform:translate(-50%,-50%) scaleY(0)}
.fa{max-height:0;overflow:hidden;transition:max-height .4s ease}
.fa p{padding:0 44px 28px 0;font-size:15.5px;color:var(--muted);line-height:1.65}

/* ============ FINAL ============ */
.final{background:var(--midnight);color:var(--paper);text-align:center}
.final .eyebrow{color:var(--lavender)}
.final h2{font-size:clamp(38px,6vw,80px);max-width:14ch;margin:26px auto 0}
.final h2 .it{color:var(--lavender)}
.final p{color:var(--muted-d);font-size:18px;max-width:44ch;margin:30px auto 44px}
.final .support{margin-top:70px;padding-top:40px;border-top:1px solid var(--line-d);
  display:flex;flex-direction:column;align-items:center;gap:18px}
.final .support .t{font-size:14px;color:var(--muted-d)}
.final .support .txtlink{color:var(--paper);border-color:var(--line-d)}
.final .support .txtlink:hover{color:var(--lavender);border-color:var(--lavender)}

/* ============ FOOTER ============ */
footer{background:var(--midnight);color:var(--muted-d);padding:36px 0;font-size:13px;border-top:1px solid var(--line-d)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
footer .nm{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--paper)}
footer a{color:var(--paper);border-bottom:1px solid var(--line-d)}

/* ============ BONUS / DEPOIMENTOS ============ */
.strip .head{text-align:center;max-width:54ch;margin:0 auto}
.strip h2{font-size:clamp(30px,4.4vw,52px);margin-top:16px}
.strip h2 .it{color:var(--purple)}
.marquee{overflow:hidden;margin-top:38px;padding:20px 0;
  -webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mtrack{display:flex;gap:20px;width:max-content;animation:marq 70s linear infinite}
.marquee:hover .mtrack{animation-play-state:paused}
.marquee.rev .mtrack{animation-direction:reverse;animation-duration:90s}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mtrack .mslide{height:440px;width:330px;flex:0 0 auto;border-radius:22px;
  background-size:cover;background-position:center top;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
  overflow:hidden;position:relative}
.mtrack .mslide:hover{transform:scale(1.04) translateY(-6px)}
.depo .mtrack .mslide{height:280px;width:290px;border-radius:20px}
.depo .marquee{overflow:visible;-webkit-mask:none;mask:none}
.depo .mtrack{animation:none;width:100%;justify-content:center;flex-wrap:wrap}
@media(max-width:560px){.mtrack .mslide{height:300px;width:240px}.depo .mtrack .mslide{height:220px;width:200px}}
/* module cover cards */
.mcov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;background:linear-gradient(0deg,rgba(5,0,15,.98) 0%,rgba(5,0,15,.82) 30%,transparent 55%)}
.mcov-tag{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lavender);margin-bottom:10px;display:block}
.mcov-title{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--paper);line-height:1.2;letter-spacing:-.02em;margin:0}
.mcov-detail{font-size:11px;color:rgba(241,239,246,.45);margin-top:10px;display:block;letter-spacing:.04em}
.mod-apol{background-color:#0F032D;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod001.webp)}
.mod-mat{background-color:#020C1A;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod002.webp)}
.mod-jgj{background-color:#180330;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod003.webp)}
.mod-pp{background-color:#02121A;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod004.webp)}
.mod-ib{background-color:#2D030F;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod005.webp)}
.mod-conv{background-color:#110B20;background-image:url(https://nbnrwghtecsjejcpxkje.supabase.co/storage/v1/object/public/ai-images/clube-fe-razao/mod006.webp)}

/* reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* responsive */
@media(max-width:880px){
  .threats{grid-template-columns:1fr;gap:54px}
  .prow{grid-template-columns:1fr;gap:12px;padding:34px 0}
  .prow .ix{font-size:15px}
  .mrow{grid-template-columns:1fr;gap:10px;padding:28px 0}
  .mrow .me{text-align:left;padding-top:0}
  .mrow .md{padding-top:0}
  .mrow:hover{padding-left:0}
  .community{grid-template-columns:1fr;gap:54px}
  .brand-art{margin:0 auto}
  .gline{grid-template-columns:1fr;gap:24px;text-align:center}
  .gline p{margin-inline:auto}
  .gline .seven{margin:0 auto}
}
@media(max-width:740px){
  .hero{
    background-image:
      linear-gradient(180deg, rgba(15,3,45,.1) 0%, rgba(15,3,45,.48) 40%, rgba(15,3,45,.92) 64%, var(--midnight) 100%),
      var(--hero-img);
    background-position:center, 72% top;
    background-size:cover,cover}
  .hero-body{align-items:flex-end;padding-bottom:20px}
  .tgrid{grid-template-columns:1fr;gap:0}
  .tcell{border-top:1px solid var(--line);padding:26px 0}
  .tcell:first-child{border-top:2px solid var(--ink)}
  .tother{grid-template-columns:1fr;gap:18px}
}
@media(max-width:560px){
  .wrap,.hero-foot{padding-left:22px;padding-right:22px}
  .hero h1{font-size:clamp(40px,12vw,60px)}
  .hero-actions{gap:24px}
  .cta.brand{font-size:15px;padding:18px 26px}
  .panel{margin:0 8px;border-radius:22px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
